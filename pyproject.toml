[project]
name = "rfc9180"
version = "0.2.0"
description = "A Python implementation of Hybrid Public Key Encryption (HPKE) as specified in RFC 9180"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "rfc9180-py Contributors" }
]
keywords = ["hpke", "encryption", "rfc9180", "hybrid", "public-key", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "cryptography>=41.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "hatch>=1.0.0",
    # docs (so dev can build docs)
    "sphinx>=7.4.0,<9.0.0",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-rtd-theme>=3.0.0",
]
docs = [
    "sphinx>=7.4.0,<9.0.0",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-rtd-theme>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/MFDI-hub/rfc9180-py"
Documentation = "https://mfdi-hub.github.io/rfc9180-py/"
Repository = "https://github.com/MFDI-hub/rfc9180-py"
Issues = "https://github.com/MFDI-hub/rfc9180-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfc9180"]

[tool.hatch.build.targets.wheel.shared-data]
"src/rfc9180/py.typed" = "py.typed"

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "sphinx>=7.4.0,<9.0.0",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-rtd-theme>=3.0.0",
]
[tool.hatch.envs.default.scripts]
docs = "sphinx-build -b html docs docs/_build/html"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.format]
line-ending = "auto"
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["E501", "S101", "S106"]  # allow longer lines, assert, input in tests

[tool.mypy]
python_version = "3.9"
strict = true
disallow_any_unimported = true
warn_unreachable = true
ignore_missing_imports = false
warn_return_any = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Note: uv virtual environment naming
# uv does not currently support configuring virtual environment name in pyproject.toml
# To create a venv with a custom name, use: uv venv <name>
# Default behavior: uv creates a venv named ".venv" in the project directory
# Example: uv venv .venv-rfc9180

