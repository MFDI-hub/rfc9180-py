name: Publish

on:
    workflow_dispatch:
        inputs:
            repository:
                description: "Where to publish"
                required: true
                default: "testpypi"
                type: choice
                options:
                    - testpypi
                    - pypi
                    - both

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python
              run: uv python install 3.12

            - name: Build package
              run: uv build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: python-dist
                  path: dist/

    publish-testpypi:
        if: ${{ inputs.repository == 'testpypi' || inputs.repository == 'both' }}
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python
              run: uv python install 3.12

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: python-dist
                  path: dist/

            - name: Publish to TestPyPI
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
              run: uv run --with twine twine upload --repository-url https://test.pypi.org/legacy/ dist/*

    publish-pypi:
        if: ${{ inputs.repository == 'pypi' || inputs.repository == 'both' }}
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python
              run: uv python install 3.12

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: python-dist
                  path: dist/

            - name: Publish to PyPI
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: uv run --with twine twine upload dist/*
